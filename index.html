<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maresias 🌊</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    #smoke {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Glow overlay elements */
    .glow-overlay {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      border-radius: 50%;
    }

    #ui {
      position: fixed;
      top: 18vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      backdrop-filter: blur(6px) saturate(1.1);
      -webkit-backdrop-filter: blur(6px) saturate(1.1);
      background: rgba(10, 0, 30, 0.18);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 16px;
      padding: 2rem 3rem;
      min-width: 420px;
    }

    #ui h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 20px #a855f7, 0 0 40px #7c3aed;
    }

    #ui .dates {
      font-size: 1rem;
      color: #c4b5fd;
      letter-spacing: 0.12em;
      margin-top: 0.3rem;
      margin-bottom: 1.5rem;
    }

    #clock {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }

    .clock-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .clock-unit .num {
      font-size: 3.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 0 0 12px #a855f7, 0 0 24px #7c3aed;
      line-height: 1;
    }

    .clock-unit .label {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: #a855f7;
      text-transform: uppercase;
    }

    #done {
      display: none;
      font-size: 1.8rem;
      color: #fff;
      text-shadow: 0 0 20px #a855f7;
    }

    @media (max-width: 480px) {
      #ui {
        min-width: unset;
        width: 90vw;
        padding: 1.1rem 1.4rem;
        top: 14vh;
      }
      #ui h1 { font-size: 1.6rem; letter-spacing: 0.12em; }
      #ui .dates { font-size: 0.75rem; margin-bottom: 0.9rem; }
      #clock { gap: 0.8rem; }
      .clock-unit .num { font-size: 2rem; }
      .clock-unit .label { font-size: 0.55rem; }
      #done { font-size: 1.1rem; }
    }

    /* ── Mushroom pulse ── */
    @keyframes mushroomPulse {
      0%, 100% { box-shadow: 0 0 10px 4px rgba(168,85,247,0.5); opacity: 0.6; }
      50%       { box-shadow: 0 0 28px 10px rgba(192,132,252,0.9); opacity: 0.9; }
    }

    /* ── Neon flicker + hue ── */
    @keyframes neonAnimate {
      0%   { opacity: 1;   filter: brightness(1)   hue-rotate(0deg);  }
      7%   { opacity: 0.7; filter: brightness(0.8)  hue-rotate(5deg);  }
      10%  { opacity: 1;   filter: brightness(1.4)  hue-rotate(10deg); }
      13%  { opacity: 0.8; filter: brightness(0.9)  hue-rotate(15deg); }
      16%  { opacity: 1;   filter: brightness(1.3)  hue-rotate(20deg); }
      50%  { opacity: 1;   filter: brightness(1.1)  hue-rotate(30deg); }
      80%  { opacity: 1;   filter: brightness(1)    hue-rotate(15deg); }
      100% { opacity: 1;   filter: brightness(1)    hue-rotate(0deg);  }
    }

    /* ── String light pulse ── */
    @keyframes lightPulse {
      0%,100% { opacity: 0.6; box-shadow: 0 0 4px 2px rgba(255,220,80,0.5); }
      50%     { opacity: 1.0; box-shadow: 0 0 14px 6px rgba(255,220,80,0.95); }
    }

    /* ── Totoro eye glow ── */
    @keyframes totoroPulse {
      0%,100% { box-shadow: 0 0 4px 2px rgba(74,222,128,0.4); opacity: 0.5; }
      50%     { box-shadow: 0 0 16px 6px rgba(34,197,94,0.9);  opacity: 0.85; }
    }
  </style>
</head>
<body>

  <video id="bg" src="maresias-bg.mp4" autoplay loop muted playsinline></video>
  <canvas id="smoke"></canvas>

  <!-- Glow overlays — positioned by JS after load -->
  <div class="glow-overlay" id="glow-mush-1"></div>
  <div class="glow-overlay" id="glow-mush-2"></div>
  <div class="glow-overlay" id="glow-mush-3"></div>
  <div class="glow-overlay" id="glow-mush-4"></div>
  <div class="glow-overlay" id="glow-neon"></div>
  <div class="glow-overlay" id="glow-totoro"></div>
  <div class="glow-overlay" id="glow-light-1"></div>
  <div class="glow-overlay" id="glow-light-2"></div>
  <div class="glow-overlay" id="glow-light-3"></div>
  <div class="glow-overlay" id="glow-light-4"></div>
  <div class="glow-overlay" id="glow-light-5"></div>
  <div class="glow-overlay" id="glow-light-6"></div>

  <div id="ui">
    <h1>Maresias</h1>
    <p class="dates">9 – 12 de Julho</p>
    <div id="clock">
      <div class="clock-unit">
        <span class="num" id="days">00</span>
        <span class="label">Dias</span>
      </div>
      <div class="clock-unit">
        <span class="num" id="hours">00</span>
        <span class="label">Horas</span>
      </div>
      <div class="clock-unit">
        <span class="num" id="mins">00</span>
        <span class="label">Min</span>
      </div>
      <div class="clock-unit">
        <span class="num" id="secs">00</span>
        <span class="label">Seg</span>
      </div>
    </div>
    <p id="done">🌊 Chegou a hora! Bora pra Maresias!</p>
  </div>

  <script>
    // ── Glow overlay positioning ─────────────────────────────────────────
    // All positions are % of viewport width/height.
    // Tune these numbers if the image is cropped differently on your screen.
    const overlays = [
      // Mushroom cluster bottom-left
      { id: 'glow-mush-1', x: 8,  y: 72, w: 60, h: 60,
        style: 'animation: mushroomPulse 2.5s ease-in-out infinite; animation-delay: 0s;' },
      { id: 'glow-mush-2', x: 13, y: 78, w: 50, h: 50,
        style: 'animation: mushroomPulse 2.5s ease-in-out infinite; animation-delay: 0.6s;' },
      { id: 'glow-mush-3', x: 6,  y: 83, w: 40, h: 40,
        style: 'animation: mushroomPulse 2.5s ease-in-out infinite; animation-delay: 1.2s;' },
      // Table mushrooms (centre-left area)
      { id: 'glow-mush-4', x: 28, y: 62, w: 30, h: 30,
        style: 'animation: mushroomPulse 2.5s ease-in-out infinite; animation-delay: 1.8s;' },

      // Neon sign top-centre
      { id: 'glow-neon', x: 32, y: 2, w: 360, h: 60,
        style: 'border-radius: 8px; animation: neonAnimate 6s ease-in-out infinite;' },

      // Totoro eyes (left shelf area)
      { id: 'glow-totoro', x: 16, y: 53, w: 28, h: 16,
        style: 'animation: totoroPulse 3s ease-in-out infinite;' },

      // String lights — left strand
      { id: 'glow-light-1', x: 4,  y: 19, w: 10, h: 10,
        style: 'animation: lightPulse 3.1s ease-in-out infinite; animation-delay: 0s;' },
      { id: 'glow-light-2', x: 14, y: 16, w: 10, h: 10,
        style: 'animation: lightPulse 2.9s ease-in-out infinite; animation-delay: 0.7s;' },
      { id: 'glow-light-3', x: 24, y: 18, w: 10, h: 10,
        style: 'animation: lightPulse 3.3s ease-in-out infinite; animation-delay: 1.3s;' },
      // String lights — right strand
      { id: 'glow-light-4', x: 68, y: 18, w: 10, h: 10,
        style: 'animation: lightPulse 3.0s ease-in-out infinite; animation-delay: 0.4s;' },
      { id: 'glow-light-5', x: 78, y: 16, w: 10, h: 10,
        style: 'animation: lightPulse 3.2s ease-in-out infinite; animation-delay: 1.1s;' },
      { id: 'glow-light-6', x: 88, y: 19, w: 10, h: 10,
        style: 'animation: lightPulse 2.8s ease-in-out infinite; animation-delay: 1.8s;' },
    ];

    overlays.forEach(({ id, x, y, w, h, style }) => {
      const el = document.getElementById(id);
      el.style.cssText += `
        left: ${x}%;
        top: ${y}%;
        width: ${w}px;
        height: ${h}px;
        ${style}
      `;
    });

    // ── Smoke particle system ─────────────────────────────────────────────
    const canvas = document.getElementById('smoke');
    const ctx = canvas.getContext('2d');

    // Emitter position as % of viewport (incense stick location)
    const EMITTER_X_PCT = 0.415;
    const EMITTER_Y_PCT = 0.485;

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x        = canvas.width  * EMITTER_X_PCT + (Math.random() - 0.5) * 4;
        this.y        = canvas.height * EMITTER_Y_PCT;
        this.vy       = -(0.6 + Math.random() * 0.6);
        this.age      = 0;
        this.lifetime = 100 + Math.random() * 40;
        this.phase    = Math.random() * Math.PI * 2;
        this.maxR     = 5 + Math.random() * 5;
      }
      update() {
        this.age++;
        this.y += this.vy;
        this.x += Math.sin(this.age * 0.05 + this.phase) * 0.5;
      }
      get progress()  { return this.age / this.lifetime; }
      get opacity()   { return 0.35 * (1 - this.progress); }
      get radius()    { return 2 + (this.maxR - 2) * this.progress; }
      get isDead()    { return this.age >= this.lifetime; }
      draw() {
        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
        g.addColorStop(0, `rgba(210,190,255,${this.opacity})`);
        g.addColorStop(1, `rgba(210,190,255,0)`);
        ctx.beginPath();
        ctx.fillStyle = g;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particles = Array.from({ length: 12 }, () => {
      const p = new Particle();
      p.age = Math.floor(Math.random() * p.lifetime);
      return p;
    });

    let frame = 0;
    function animateSmoke() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frame++;

      if (frame % 8 === 0) {
        const dead = particles.findIndex(p => p.isDead);
        if (dead !== -1) particles[dead].reset();
        else particles.push(new Particle());
      }

      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateSmoke);
    }
    animateSmoke();

    // ── Countdown ─────────────────────────────────────────────────────────
    const TARGET = new Date('2026-07-09T18:00:00-03:00');

    const elDays  = document.getElementById('days');
    const elHours = document.getElementById('hours');
    const elMins  = document.getElementById('mins');
    const elSecs  = document.getElementById('secs');
    const elClock = document.getElementById('clock');
    const elDone  = document.getElementById('done');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const remaining = TARGET - Date.now();

      if (remaining <= 0) {
        elClock.style.display = 'none';
        elDone.style.display  = 'block';
        return;
      }

      const totalSecs = Math.floor(remaining / 1000);
      const secs  = totalSecs % 60;
      const mins  = Math.floor(totalSecs / 60) % 60;
      const hours = Math.floor(totalSecs / 3600) % 24;
      const days  = Math.floor(totalSecs / 86400);

      elDays.textContent  = pad(days);
      elHours.textContent = pad(hours);
      elMins.textContent  = pad(mins);
      elSecs.textContent  = pad(secs);

      setTimeout(tick, 1000);
    }

    tick();
  </script>
</body>
</html>
